name: Build Android APK (Accounting App)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: |
          flutter --version
          flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Build Split-per-ABI APK (Optimized for Samsung Galaxy ARM64)
        run: flutter build apk --release --split-per-abi

      - name: Upload Universal Release APK
        uses: actions/upload-artifact@v4
        with:
          name: accounting-app-universal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Split APKs (arm64-v8a for Galaxy S10+)
        uses: actions/upload-artifact@v4
        with:
          name: accounting-app-split-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: ignore
          retention-days: 30
